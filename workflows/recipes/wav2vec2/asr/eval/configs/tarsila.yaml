model:
  name: "omniASR_LLM_1B" # replace with [omniASR_CTC_1B, omniASR_CTC_3B,  omniASR_CTC_7B] or the LLM variants
tokenizer:
  name: "omniASR_tokenizer_v1" # replace with "omniASR_tokenizer_written_v2" if using v2 models

dataset:
  name: "tarsila"
  valid_split: "test"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "/home/jovyan/data/tarsila/language_distribution_1.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_streaming:
      partition_filters: 'pc.is_in(pc.field("corpus"), pa.array(["tarsila"]))'
    fragment_loading:
      cache: True
      num_parallel_fragments: 2
      nb_prefetch: 2
  asr_task_config:
     min_audio_len: 16_000
     max_audio_len: 320_000
     max_num_elements: 8
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 1
